<!DOCTYPE html>
<html>
<head>
<title>Student Application Form</title>

<style>
body{
    font-family:'Segoe UI', sans-serif;
    background: linear-gradient(to right, #e0f2fe, #f0fdf4);
    margin:0;
}

.container{
    width:60%;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#1e3a8a;
}

.info{
    text-align:center;
    margin-bottom:20px;
    color:#555;
    font-weight:bold;
}

fieldset{
    border:none;
    margin-bottom:20px;
}

legend{
    font-weight:bold;
    color:#065f46;
    margin-bottom:10px;
}

label{
    display:block;
    margin-top:10px;
    font-size:14px;
}

input, select, textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

input:focus, select:focus, textarea:focus{
    border-color:#10b981;
    outline:none;
}

.inline{
    width:auto;
    margin-right:10px;
}

button{
    width:100%;
    padding:12px;
    background:linear-gradient(135deg, #34d399, #059669);
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}
</style>
</head>

<body>

<div class="container">

<h1>Student Application Form</h1>

<div class="info">
    Name: Suhana Bagwan | Roll No: 23
</div>

<form action="#" method="post">

<fieldset>
<legend>Personal Information</legend>

<label>Full Name</label>
<input type="text" name="name" placeholder="Enter your full name" required>

<label>Email</label>
<input type="email" name="email" placeholder="example@email.com" required>

<label>Phone Number</label>
<input type="tel" name="phone" pattern="[0-9]{10}" placeholder="10-digit number" required>

<label>Date of Birth</label>
<input type="date" name="dob" required>

<label>Gender</label>
<input type="radio" name="gender" value="male" class="inline" required> Male
<input type="radio" name="gender" value="female" class="inline"> Female
<input type="radio" name="gender" value="other" class="inline"> Other

</fieldset>

<fieldset>
<legend>Academic Details</legend>

<label>Course</label>
<select name="course" required>
<option value="">Select</option>
<option>CSE</option>
<option>IT</option>
<option>ECE</option>
<option>Mechanical</option>
</select>

<label>Year</label>
<input type="number" name="year" min="1" max="4" required>

<label>CGPA</label>
<input type="number" step="0.01" min="0" max="10" placeholder="e.g. 8.5">

<label>Skills</label>
<input type="checkbox" name="skills" class="inline"> HTML
<input type="checkbox" name="skills" class="inline"> CSS
<input type="checkbox" name="skills" class="inline"> Java
<input type="checkbox" name="skills" class="inline"> Python

</fieldset>

<fieldset>
<legend>Additional Information</legend>

<label>Upload Resume</label>
<input type="file" name="resume" accept=".pdf,.doc,.docx">

<label>Address</label>
<textarea rows="3" placeholder="Enter your address"></textarea>

<label>Why should we select you?</label>
<textarea rows="4" maxlength="200" placeholder="Max 200 characters"></textarea>

</fieldset>

<button type="submit">Submit Application</button>

</form>

</div>

</body>
</html>
