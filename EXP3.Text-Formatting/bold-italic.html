<h1>Bold and Italic Tags</h1>

<h2>Bold Tag</h2>
<p><b>This text is bold.</b>  
Used to make text visually bold.</p>

<h2>Strong Tag</h2>
<p><strong>This text is strong.</strong>  
Used to show important text.</p>

<h2>Italic Tag</h2>
<p><i>This text is italic.</i>  
Used to make text slanted.</p>

<h2>Emphasis Tag</h2>
<p><em>This text is emphasized.</em>  
Used to stress importance.</p>
