    <h1>HTML Image Tag Example</h1>

    <p>
        The <b>&lt;img&gt;</b> tag is used to display images on a web page.
        It uses attributes like <b>src</b>, <b>alt</b>, <b>width</b>, and <b>height</b>.
    </p>

    <h2>Example 1</h2>
    <img 
        src="https://upload.wikimedia.org/wikipedia/commons/4/40/Sunflower_sky_backdrop.jpg"
        alt="Sunflower Image"
        width="300"
        height="200"
    >

    

    <hr>

    <p>
        Images enhance the visual appearance of a web page.
    </p>
